  "_testSuiteComment": [
    "The official HL7 FHIRPath conformance suites and the example resources they",
    "evaluate against, pinned to one commit of FHIR/fhir-test-cases. The repo",
    "states its contents are Creative Commons Public Domain.",
    "",
    "The input files are NOT listed here: vendorpkg reads them out of each suite's",
    "inputfile attributes and fetches exactly those. A hardcoded list would drift",
    "as the suite grows.",
    "",
    "Fetched files are committed under internal/fhirpath/testdata so `make check`",
    "runs the conformance suites offline."
  ],
